[workspace]
members  = ["examples/wasm_player"]
# Only build the root crate by default; the WASM player is a separate target.
default-members = ["."]

[package]
name = "dash-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of MPEG-DASH playback logic: MPD parsing, ABR selection, media fetching, and an MSE-like buffer abstraction"
license = "BSD-3-Clause"
repository = "https://github.com/jacksd60/dash-rs"
keywords = ["dash", "mpeg-dash", "streaming", "abr", "mpd"]
categories = ["multimedia", "network-programming"]

[features]
## Enable the GStreamer-backed `MediaSource` / `SourceBuffer` implementation.
## Requires GStreamer ≥ 1.14 headers; on macOS: `brew install gstreamer`.
sink-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
quick-xml        = { version = "0.36", features = ["serialize"] }
serde            = { version = "1", features = ["derive"] }
bytes            = "1"
url              = "2"
thiserror        = "2"
async-trait      = "0.1"
tracing          = "0.1"
rand             = "0.8"
async-broadcast  = "0.5"
futures-timer    = "3"
futures          = { version = "0.3", default-features = false, features = ["std"] }
gstreamer        = { version = "0.24", optional = true, features = ["v1_22"] }
gstreamer-app    = { version = "0.24", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom     = { version = "0.2", features = ["js"] }
js-sys        = "0.3"
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[dev-dependencies]
tokio              = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest            = { version = "0.13" }

[[example]]
name = "gstreamer_player"
required-features = ["sink-gstreamer"]
