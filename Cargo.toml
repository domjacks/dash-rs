[workspace]
members  = ["examples/wasm_player"]
# Only build the root crate by default; the WASM player is a separate target.
default-members = ["."]

[package]
name = "dash-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of MPEG-DASH playback logic: MPD parsing, ABR selection, media fetching, and buffer abstraction"
license = "BSD-3-Clause"
repository = "https://github.com/jacksd60/dash-rs"
keywords = ["dash", "mpeg-dash", "streaming", "abr", "mpd"]
categories = ["multimedia", "network-programming"]

[features]
## Enable the GStreamer-backed `MediaSource` / `SourceBuffer` implementation.
## Requires GStreamer ≥ 1.14 headers; on macOS: `brew install gstreamer`.
sink-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
## Enable std-requiring features: real url::Url, SystemClock, Delay-based retries.
## Enabled by default; disable with `default-features = false` for no_std builds.
std = ["dep:url", "dep:futures-timer"]
default = ["std"]

[dependencies]
roxmltree        = { version = "0.21", default-features = false }
bytes            = { version = "1", default-features = false }
url              = { version = "2", optional = true }
thiserror        = { version = "2", default-features = false }
async-trait      = "0.1"
rand             = { version = "0.8", default-features = false, features = ["small_rng"] }
futures-timer    = { version = "3", optional = true }
futures          = { version = "0.3", default-features = false, features = ["alloc"] }
hashbrown        = "0.16"
libm             = { version = "0.2", default-features = false }
gstreamer        = { version = "0.24", optional = true, features = ["v1_22"] }
gstreamer-app    = { version = "0.24", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys        = "0.3"
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[dev-dependencies]
tokio              = { version = "1", features = ["full"] }
tracing            = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest            = { version = "0.13" }

[[example]]
name = "gstreamer_player"
required-features = ["sink-gstreamer"]
