[package]
name    = "wasm_player"
version = "0.1.0"
edition = "2021"
# This crate only targets wasm32-unknown-unknown and is never published.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The library we are demonstrating.
dash-rs = { path = "../.." }

# WASM / JS glue.
# web-sys is intentionally absent: all browser Web API calls (MSE, Fetch,
# performance.now, Date.now, setTimeout) are made from plain JavaScript in
# index.html and reach Rust only through the JsBridge extern type.
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
console_error_panic_hook = "0.1"

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.url]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-wasm]
version = "0.2"
