[package]
name    = "wasm_player"
version = "0.1.0"
edition = "2021"
# This crate only targets wasm32-unknown-unknown and is never published.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The library we are demonstrating.
dash-rs = { path = "../.." }

# WASM / JS glue.
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version  = "0.3"
features = [
  "Window",
  "Performance",
  "Document",
  "Element",
  "HtmlVideoElement",
  "MediaSource",
  "MediaSourceReadyState",
  "SourceBuffer",
  "TimeRanges",
  "Headers",
  "RequestInit",
  "RequestMode",
  "Request",
  "Response",
  "Url",
]

[dependencies.async-trait]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.url]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-wasm]
version = "0.2"

[dependencies.futures]
version          = "0.3"
default-features = false
features         = ["std"]
