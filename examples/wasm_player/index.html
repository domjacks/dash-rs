<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dash-rs WASM player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      gap: 1rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.03em; }
    video {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 6px;
    }
    form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 900px;
    }
    input[type=text] {
      flex: 1;
      padding: 0.45rem 0.75rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #222;
      color: #eee;
      font-size: 0.85rem;
    }
    button {
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 4px;
      background: #1a7fd4;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #1569b0; }
    #status {
      font-size: 0.8rem;
      color: #aaa;
      min-height: 1.2em;
      text-align: center;
    }
    #status.error { color: #f55; }

    /* On-screen API call log */
    #log-section {
      width: 100%;
      max-width: 900px;
    }
    #log-section h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }
    #api-log {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      height: 220px;
      overflow-y: auto;
      color: #ccc;
    }
    /* Web API bridge calls — coloured by category */
    #api-log .cat-mse   { color: #5bf; }
    #api-log .cat-fetch { color: #8d8; }
    #api-log .cat-clock { color: #fa8; }
    #api-log .cat-util  { color: #aaa; }
    /* Rust tracing / console output — coloured by severity level */
    #api-log .level-log   { color: #ccc; }
    #api-log .level-info  { color: #ccc; }
    #api-log .level-warn  { color: #fb3; }
    #api-log .level-error { color: #f55; }
    #api-log .level-debug { color: #555; }
  </style>
</head>
<body>
  <h1>dash-rs &mdash; WASM player</h1>

  <video id="video" controls autoplay muted></video>

  <form id="form">
    <input
      id="url-input"
      type="text"
      placeholder="MPEG-DASH manifest URL (.mpd)"
      value="https://rdmedia.bbc.co.uk/bbb/2/client_manifest-common_init.mpd"
    />
    <button type="submit">Play</button>
  </form>

  <div id="status">Loading WASM module…</div>

  <section id="log-section">
    <h2>Player log</h2>
    <div id="api-log"></div>
  </section>

  <!--
    wasm-pack build --target web outputs:
      pkg/wasm_player.js       ES module glue
      pkg/wasm_player_bg.wasm  compiled WASM binary

    Build (from workspace root):
      wasm-pack build examples/wasm_player --target web --out-dir examples/wasm_player/pkg

    player.js contains the bridge object (all MSE + Fetch Web API calls) and
    the UI wiring.  WASM drives the DASH logic and calls bridge methods for
    every browser interaction.
  -->
  <script type="module" src="./player.js"></script>
</body>
</html>
