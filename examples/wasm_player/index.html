<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dash-rs WASM player</title>
  <link href="./styles.css" rel="stylesheet" />
</head>
<body>
  <h1>dash-rs &mdash; WASM player</h1>

  <div id="player-wrap">

    <!-- Left column: video + URL form + status line -->
    <div id="left-col">
      <video id="video" controls autoplay muted></video>

      <form id="form">
        <input
          id="url-input"
          type="text"
          placeholder="MPEG-DASH manifest URL (.mpd)"
          value="https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd"
        />
        <button type="submit">Load</button>
      </form>

      <div id="status">Loading WASM module&hellip;</div>
    </div>

    <!-- Right column: debug panel + player log -->
    <div id="right-col">

      <!-- Debug panel — updated every 500 ms by app.js -->
      <section id="debug-panel">
        <h2>Playback stats</h2>

        <div class="debug-row">
          <span class="debug-label">State</span>
          <span class="debug-value" id="dp-state">
            <span class="state-badge"><span class="dot" id="dp-dot"></span><span id="dp-state-text">—</span></span>
          </span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Stream type</span>
          <span class="debug-value" id="dp-live">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Position</span>
          <span class="debug-value" id="dp-pos">—</span>
        </div>

        <div class="debug-row">
          <span class="debug-label">Video quality</span>
          <span class="debug-value" id="dp-vq">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Video bandwidth</span>
          <span class="debug-value" id="dp-vbps">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Video buffer</span>
          <span class="debug-value" id="dp-vbuf">—</span>
        </div>

        <div class="debug-row">
          <span class="debug-label">Audio quality</span>
          <span class="debug-value" id="dp-aq">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Audio bandwidth</span>
          <span class="debug-value" id="dp-abps">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Audio buffer</span>
          <span class="debug-value" id="dp-abuf">—</span>
        </div>

        <div class="debug-row">
          <span class="debug-label">HTTP requests</span>
          <span class="debug-value" id="dp-hc">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Quality switches</span>
          <span class="debug-value" id="dp-sc">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Last segment</span>
          <span class="debug-value" id="dp-url">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Last fetch time</span>
          <span class="debug-value" id="dp-tms">—</span>
        </div>
        <div class="debug-row">
          <span class="debug-label">Throughput</span>
          <span class="debug-value" id="dp-tbps">—</span>
        </div>
      </section>

      <section id="log-section">
        <h2>Player log</h2>
        <div id="api-log"></div>
      </section>

    </div><!-- #right-col -->
  </div><!-- #player-wrap -->

  <!--
    wasm-pack build --target web outputs:
      pkg/wasm_player.js       ES module glue
      pkg/wasm_player_bg.wasm  compiled WASM binary

    Build (from workspace root):
      wasm-pack build examples/wasm_player --target web --out-dir examples/wasm_player/pkg

    app.js    — UI wiring: on-screen logger, WASM init, form handler.
    player.js — MSE bridge: all browser Web API calls made by dash-rs.
                Exports createBridge(video, log); imported by app.js.
  -->
  <script type="module" src="./app.js"></script>
</body>
</html>
